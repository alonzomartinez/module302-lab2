<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

<!-- Google Fonts: Figtree (Weights 500, 800) -->

  <link 
      href="https://googleapis.com/css2?family=Figtree:wght@500;800&display=swap" 
      rel="stylesheet">
  <link rel="stylesheet" href="style.css">

<!-- Bootstrap 5 CSS -->

  <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
      rel="stylesheet">

<!-- Custom CSS Override -->
  <link rel="stylesheet" href="style.css">

</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-4">

  <main class="blog-card p-4 bg-white">
    <!-- Featured Image -->
    <div class="card-img-container mb-4">
      <img src="./assets/images/illustration-article.svg" 
      alt="Abstract geometric design background" 
      class="img-fluid rounded-3 w-100">
    </div>

    <!-- Content Section -->
    <article>
      <!-- Tag / Category -->
      <span class="badge-tag d-inline-block px-3 py-1 mb-3 rounded-2 fw-800">
        Learning
      </span>

      <!-- Date -->
      <p class="published-date mb-3 text-body-emphasis">
        Published 21 Dec 2023
      </p>

      <!-- Interactive Title -->
      <h1 class="mb-3">
        <a href="#" class="blog-title fw-800 text-decoration-none">
          HTML & CSS foundations
        </a>
      </h1>

      <!-- Description -->
      <p class="blog-description mb-4">
        These languages are the backbones of every website, defining structure, content, and presentation.
      </p>
    </article>

    <!-- Author Profile Info -->
    <footer class="author-container d-flex align-items-center gap-3">
      <img src="./assets/images/image-avatar.webp" 
      alt="Greg Hooper avatar" 
      class="author-avatar img-fluid">
      <span class="author-name fw-800">Greg Hooper</span>
    </footer>
  </main>

</body>
</html>
