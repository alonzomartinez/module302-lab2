<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

<link rel="stylesheet" href="style.css" />
<link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Outfit"
    />

  <link 
      rel="icon" 
      type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

<!-- Bootstrap 5 CSS -->
<link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
      rel="stylesheet">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>

<link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <main class="qr-card p-3 bg-white text-center shadow-sm">
    <div class="qr-img-container mb-4">
      <img src="./images/image-qr-code.png" alt="QR Code to Frontend Mentor website" class="img-fluid w-100 h-100">
    </div>
    <div class="px-2 pb-3">
      <h1 class="qr-title mb-3">
        Improve your front-end skills by building projects
      </h1>
      <p class="qr-description mb-0">
        Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
      </p>
    </div>
  </main>

</body>
</html>
